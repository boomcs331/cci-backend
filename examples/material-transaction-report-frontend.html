<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงานการรับเข้า-จ่ายออกวัตถุดิบ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="container mx-auto p-6">
    <h1 class="text-2xl font-bold mb-6">รายงานการรับเข้า-จ่ายออกวัตถุดิบ</h1>

    <!-- Filters -->
    <div class="bg-white p-4 rounded shadow mb-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">วันที่เริ่มต้น</label>
          <input id="startDate" type="date" class="w-full border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">วันที่สิ้นสุด</label>
          <input id="endDate" type="date" class="w-full border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">รหัสวัตถุดิบ</label>
          <input id="materialId" type="number" class="w-full border rounded px-3 py-2" placeholder="ทั้งหมด">
        </div>
        <div class="flex items-end">
          <button 
            id="searchBtn"
            class="w-full bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
            onclick="fetchReport()"
          >
            ค้นหา
          </button>
        </div>
      </div>
    </div>

    <!-- Report Table -->
    <div class="bg-white rounded shadow overflow-hidden">
      <table class="w-full">
        <thead class="bg-gray-100">
          <tr>
            <th class="px-4 py-3 text-left">วันที่</th>
            <th class="px-4 py-3 text-left">รหัสวัตถุดิบ</th>
            <th class="px-4 py-3 text-left">ชื่อวัตถุดิบ</th>
            <th class="px-4 py-3 text-right">รับเข้า</th>
            <th class="px-4 py-3 text-right">จ่ายออก</th>
            <th class="px-4 py-3 text-right">คงเหลือ</th>
          </tr>
        </thead>
        <tbody id="reportBody">
          <tr>
            <td colspan="6" class="px-4 py-8 text-center text-gray-500">
              กำลังโหลดข้อมูล...
            </td>
          </tr>
        </tbody>
        <tfoot id="reportFooter" class="bg-gray-100 font-bold" style="display: none;">
        </tfoot>
      </table>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:3000/api';

    async function fetchReport() {
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const materialId = document.getElementById('materialId').value;
      const searchBtn = document.getElementById('searchBtn');
      const reportBody = document.getElementById('reportBody');
      const reportFooter = document.getElementById('reportFooter');

      searchBtn.disabled = true;
      searchBtn.textContent = 'กำลังโหลด...';

      try {
        const params = new URLSearchParams();
        if (startDate) params.append('startDate', startDate);
        if (endDate) params.append('endDate', endDate);
        if (materialId) params.append('materialId', materialId);

        const response = await fetch(
          `${API_BASE_URL}/materials/transactions/report/transactions?${params.toString()}`
        );
        const result = await response.json();
        const data = result.data;

        if (data.length === 0) {
          reportBody.innerHTML = `
            <tr>
              <td colspan="6" class="px-4 py-8 text-center text-gray-500">
                ไม่พบข้อมูล
              </td>
            </tr>
          `;
          reportFooter.style.display = 'none';
          return;
        }

        // Render table rows
        reportBody.innerHTML = data.map((item, index) => `
          <tr class="border-t hover:bg-gray-50">
            <td class="px-4 py-3">${item.transactionDate}</td>
            <td class="px-4 py-3">${item.materialCode}</td>
            <td class="px-4 py-3">${item.materialName}</td>
            <td class="px-4 py-3 text-right text-green-600 font-medium">
              ${item.received.toLocaleString()}
            </td>
            <td class="px-4 py-3 text-right text-red-600 font-medium">
              ${item.issued.toLocaleString()}
            </td>
            <td class="px-4 py-3 text-right font-bold">
              ${item.balance.toLocaleString()}
            </td>
          </tr>
        `).join('');

        // Calculate totals
        const totalReceived = data.reduce((sum, item) => sum + item.received, 0);
        const totalIssued = data.reduce((sum, item) => sum + item.issued, 0);
        const totalBalance = data.reduce((sum, item) => sum + item.balance, 0);

        // Render footer
        reportFooter.innerHTML = `
          <tr>
            <td colspan="3" class="px-4 py-3">รวมทั้งหมด</td>
            <td class="px-4 py-3 text-right text-green-600">
              ${totalReceived.toLocaleString()}
            </td>
            <td class="px-4 py-3 text-right text-red-600">
              ${totalIssued.toLocaleString()}
            </td>
            <td class="px-4 py-3 text-right">${totalBalance.toLocaleString()}</td>
          </tr>
        `;
        reportFooter.style.display = '';

      } catch (error) {
        console.error('Error:', error);
        alert('เกิดข้อผิดพลาดในการดึงข้อมูล');
        reportBody.innerHTML = `
          <tr>
            <td colspan="6" class="px-4 py-8 text-center text-red-500">
              เกิดข้อผิดพลาดในการดึงข้อมูล
            </td>
          </tr>
        `;
      } finally {
        searchBtn.disabled = false;
        searchBtn.textContent = 'ค้นหา';
      }
    }

    // Load data on page load
    window.addEventListener('DOMContentLoaded', fetchReport);
  </script>
</body>
</html>
