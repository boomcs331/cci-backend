  /masters/products/locations:
    post:
      tags: [Masters — Products]
      summary: Create location
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses: { "201": { description: Created } }
    get:
      tags: [Masters — Products]
      summary: List locations (paginated)
      responses: { "200": { description: OK } }

  /masters/products/locations/all:
