openapi: 3.0.3
info:
  title: CCI Backend — Masters API
  description: |
    Master data ภายใต้ `/masters` และ `/masters/products`.
    Import คู่กับ `cci-backend.openapi.yaml` ใน Apidog (นำเข้าทั้งสองไฟล์เข้าโปรเจกต์เดียวกัน) หรือ merge paths เข้าไฟล์เดียว
  version: 0.0.1

servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: "3006"

tags:
  - name: Masters — Products
  - name: Masters — Materials

security:
  - bearerAuth: []

