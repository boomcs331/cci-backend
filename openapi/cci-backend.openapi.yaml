openapi: 3.0.3
info:
  title: CCI Backend API
  description: |
    เอกสารรวม endpoint สำหรับนำเข้า Apidog / Postman / Insomnia (Import → OpenAPI).
    พอร์ต default จาก `PORT` ใน `.env` (มักเป็น 3006).
    ส่วน Auth / บาง module อาจมี Guard — ตั้งค่า Bearer token ใน Apidog หลัง login.

    Masters (`/masters/*`, `/masters/products/*`) อยู่ในไฟล์ `cci-backend.masters.openapi.yaml`
    — นำเข้าคู่กันในโปรเจกต์ Apidog เดียวกัน หรือ merge paths ด้วยเครื่องมือ bundle OpenAPI
  version: 0.0.1

servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: "3006"

tags:
  - name: App
  - name: Auth
  - name: Auth — Users
  - name: Auth — Roles
  - name: Auth — Permissions
  - name: Auth — Audit
  - name: Products
  - name: Masters — Products
  - name: Masters — Materials
  - name: Materials
  - name: Materials — Transactions
  - name: Materials — Upload
  - name: Material issues
  - name: Production plans
  - name: Production orders
  - name: Logs

security:
  - bearerAuth: []

paths:
  /:
    get:
      tags: [App]
      summary: Root
      security: []
      responses:
        "200":
          description: OK

  /health:
    get:
      tags: [App]
      summary: Health
      security: []
      responses:
        "200":
          description: OK

  /auth/register:
    post:
      tags: [Auth]
      summary: Register user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3 }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
      responses:
        "201":
          description: Created

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, minLength: 6 }
      responses:
        "200":
          description: OK

  /auth/profile/{id}:
    get:
      tags: [Auth — Users]
      summary: Get profile by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK

  /auth/users:
    get:
      tags: [Auth — Users]
      summary: List users
      responses:
        "200":
          description: OK

  /auth/users/{id}:
    get:
      tags: [Auth — Users]
      summary: Get user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
    put:
      tags: [Auth — Users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
    delete:
      tags: [Auth — Users]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK

  /auth/users/{id}/permissions:
    get:
      tags: [Auth — Users]
      summary: User permissions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
