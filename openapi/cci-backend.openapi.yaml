  /production-plans/{id}/generate-product-qr-orders:
    post:
      tags: [Production plans]
      summary: Generate production orders + QR lots (แผนต้อง confirmed)
      description: |
        จำนวน QR = ceil(quantity / lotSize).
        lotSize จาก defaultLotSize, lotSizeByProductId, product.lot_size หรือ 100
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultLotSize: { type: number, example: 100 }
                planItemIds:
                  type: array
                  items: { type: integer }
                lotSizeByProductId:
                  type: object
                  additionalProperties: { type: number }
      responses:
        "200":
          description: OK
        "400":
          description: Bad request (e.g. not confirmed)

